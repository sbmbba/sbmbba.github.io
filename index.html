<html lang="en">

  <style>
    :root{--navy:#071b3c;--blue:#007dc5;--green:#8dc63e;--ink:#14223a;--muted:#68758b;--line:#e6ebf2;--paper:#f4f7fb;--white:#fff;--red:#d84747;--shadow:0 12px 35px rgba(7,27,60,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}h1,h2,h3,p{margin-top:0}h1,h2,h3,.brand-title{font-family:Manrope,sans-serif}.hidden{display:none!important}
    .topbar{height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,64px);box-shadow:0 4px 18px #071b3c25}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--blue),#06467c);display:grid;place-items:center;color:#fff;font-family:Manrope;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 1px #ffffff30}.brand-title{font-size:15px;font-weight:800;letter-spacing:.02em}.brand-sub{font-size:10px;color:#a9c6e0;letter-spacing:.13em;text-transform:uppercase;margin-top:3px}.top-right{display:flex;align-items:center;gap:14px}.eyebrow{color:#92b7d8;font-size:10px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}.pill{font-size:11px;background:#ffffff14;color:#cce8fa;border:1px solid #ffffff20;padding:7px 11px;border-radius:999px}
    .container{width:min(1160px,calc(100% - 36px));margin:32px auto 60px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{font-size:27px;margin:7px 0 5px;letter-spacing:-.04em}.subhead{font-size:13px;color:var(--muted);margin:0}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{padding:11px 15px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn-primary{color:#fff;background:var(--blue);box-shadow:0 5px 14px #007dc533}.btn-primary:hover{background:#006bab;transform:translateY(-1px)}.btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-secondary:hover{background:#f7f9fc}.btn-danger{background:#fff1f1;color:var(--red)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.grid{display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:22px}.stat{padding:18px 20px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:58px;height:58px;border-radius:50%;background:#007dc50b;right:-16px;top:-16px}.stat-label{color:var(--muted);font-size:11px;font-weight:600}.stat-value{font-family:Manrope;font-size:27px;letter-spacing:-.04em;font-weight:800;margin-top:7px}.stat-note{font-size:10px;color:#94a0b1;margin-top:3px}
    .feature-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.feature-card{width:100%;min-height:128px;padding:18px;display:flex;align-items:flex-start;gap:13px;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);transition:.16s}.feature-card:hover{transform:translateY(-2px);border-color:#b8d9ee;box-shadow:0 14px 28px rgba(7,27,60,.12)}.feature-icon{flex:0 0 43px;height:43px;border-radius:13px;background:#eaf5fc;color:var(--blue);display:grid;place-items:center;font-size:21px}.feature-card strong{display:block;font-family:Manrope;font-size:13px;margin:2px 0 7px}.feature-card small{display:block;font-size:11px;color:var(--muted);line-height:1.5}.welcome{padding:20px 22px;margin-bottom:17px;background:linear-gradient(115deg,#071b3c,#0a3c69);color:#fff;border-radius:15px;position:relative;overflow:hidden}.welcome h2{font-size:17px;margin:8px 0 5px}.welcome p{font-size:11px;color:#c1d5e6;margin:0}.welcome .eyebrow{color:#83c5ef}
    .module-nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}.module-nav .btn{padding:8px 11px;font-size:10px}.module-nav .active{background:var(--navy);color:#fff}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px}.panel h2{font-size:15px;margin:0}.section-kicker{font-size:10px;color:var(--muted);margin-top:5px}.current{padding:17px;border-radius:13px;background:linear-gradient(115deg,#071b3c,#0a3c69);color:#fff;margin-bottom:17px;position:relative;overflow:hidden}.current-row{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;position:relative;z-index:1}.live-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#83c5ef;font-weight:700}.current h3{font-size:16px;margin:7px 0 4px}.current-meta{font-size:11px;color:#c1d5e6}.live-dot{width:8px;height:8px;background:var(--green);box-shadow:0 0 0 4px #8dc63e28;border-radius:50%;display:inline-block;margin-right:7px}.current-actions{display:flex;gap:7px;margin-top:15px;position:relative;z-index:1;flex-wrap:wrap}.current-actions .btn{padding:8px 11px;font-size:10px}.current-actions .btn-secondary{background:#ffffff17;border-color:#ffffff30;color:#fff}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:9px;color:#8894a6;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:10px;border-bottom:1px solid var(--line)}td{font-size:11px;padding:12px 10px;border-bottom:1px solid #f0f3f7}tbody tr:last-child td{border-bottom:0}.session-name{font-weight:700;color:#21324d}.subcell{font-size:10px;color:#8995a6;margin-top:4px}.status{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:5px 9px;border-radius:999px;font-weight:700}.status-active{background:#edfaef;color:#378b4a}.status-closed{background:#f1f3f6;color:#788497}.text-btn{color:var(--blue);font-weight:700;background:none;padding:0;font-size:10px}.empty{color:#8390a2;text-align:center;padding:30px 12px;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}.toolbar input,.toolbar select{min-width:190px;flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 11px;font-size:11px;color:var(--ink)}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.metric{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fbfdff}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;font:800 21px Manrope;margin-top:5px}.note{font-size:11px;line-height:1.55;padding:12px 14px;border:1px solid #d8eaf6;border-radius:10px;background:#f2f8fc;color:#52667d;margin:12px 0}.quick-help{padding:17px;border:1px solid var(--line);border-radius:13px;background:#fff;margin-top:16px}.quick-help h3{font-size:13px;margin:0 0 7px}.quick-help p{font-size:11px;color:var(--muted);line-height:1.55;margin:0}
    .login-card{width:min(430px,100%);margin:60px auto;padding:28px}.login-card h1{font-size:24px;margin-bottom:8px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:11px;font-weight:700;color:#3d4c62}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dce3ed;border-radius:10px;background:#fff;font-size:13px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #007dc518}.message{font-size:11px;color:var(--red);min-height:16px;margin:6px 0}.modal-backdrop{position:fixed;inset:0;background:#071b3c77;display:grid;place-items:center;padding:18px;z-index:9}.modal{width:min(540px,100%);padding:24px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0;font-size:17px}.close{background:#eff3f8;color:#637087;width:31px;height:31px;border-radius:9px;font-size:17px}.qr-box{background:#f3f8fc;border:1px dashed #bdd7e9;border-radius:15px;min-height:230px;display:grid;place-items:center;margin:17px 0;padding:16px}.qr-box canvas,.qr-box img{max-width:100%}.url-box{font-size:10px;word-break:break-all;background:#f6f8fb;border-radius:8px;padding:9px;color:#5b6a80}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#10243f;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);z-index:20;font-size:12px}.check-page{min-height:calc(100vh - 72px);display:grid;place-items:start center;padding:45px 18px}.check-card{width:min(470px,100%);padding:28px}.check-logo{text-align:center;margin-bottom:23px}.check-logo .brand-mark{margin:0 auto 11px}.check-title{text-align:center;font-size:23px;margin-bottom:7px}.check-intro{text-align:center;color:var(--muted);font-size:12px;line-height:1.55}.session-chip{background:#f0f7fc;border:1px solid #d8eaf6;border-radius:11px;padding:12px 14px;margin:19px 0}.session-chip small{font-size:9px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.12em}.session-chip strong{display:block;margin-top:5px;font-size:13px}.check-result{text-align:center;padding:20px 5px}.result-icon{margin:0 auto 14px;width:54px;height:54px;border-radius:50%;background:#edfaef;color:#388b4b;display:grid;place-items:center;font-size:25px}.check-foot{text-align:center;color:#99a3b1;font-size:10px;margin-top:20px}.config-note{background:#fff8e7;color:#7d5b16;border:1px solid #f1dfa9;border-radius:9px;padding:10px 12px;font-size:11px;margin:0 0 15px}.footer{text-align:center;font-size:10px;color:#a1aaba;margin-top:32px}
    @media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-row{grid-template-columns:repeat(3,1fr)}}@media(max-width:580px){.topbar{height:64px;padding:0 16px}.top-right .pill{display:none}.container{width:calc(100% - 24px);margin:22px auto 40px}.page-head{display:block}.page-head h1{font-size:23px}.page-head .actions{margin-top:15px}.page-head .btn{flex:1}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:23px}.panel{padding:14px}.table-wrap{margin:0 -5px}.top-right{gap:6px}.login-card{margin:35px auto;padding:22px}.check-card{padding:22px}.feature-grid{grid-template-columns:1fr;gap:10px}.feature-card{min-height:92px;padding:14px}.metric-row{grid-template-columns:1fr 1fr}.module-nav{gap:6px}.module-nav .btn{flex:1}.page-head .actions .btn{flex:auto}}
    .print-only{display:none}
    @media print{body{background:#fff}.topbar,.module-nav,.actions,.toolbar,.btn,.text-btn,.footer{display:none!important}.print-only{display:block!important}.container{width:100%;margin:0}.card{box-shadow:none;border-color:#ddd}.panel{padding:0}.page-head{margin-bottom:15px}.table-wrap{overflow:visible}table{white-space:normal}th,td{font-size:9pt;padding:7px}.note{background:#fff;color:#333}}

<body>
  <header class="topbar"><div class="brand"><div class="brand-mark">LGZ</div><div><div class="brand-title">LINDUNG Gen-Z Leaders Camp</div><div class="brand-sub">Attendance · 2026</div></div></div><div class="top-right"><span class="pill">PERKESO × UUM SBM</span><span class="eyebrow" id="topStatus">Programme dashboard</span></div></header>
  <main id="app"></main><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm';
    import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm';

    // Browser-safe project URL and publishable key. Never use a Supabase secret/service_role key here.
    const SUPABASE_URL = 'https://jkpkbvutwgwykrfmgpwe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__QCKTZbXnvq7dXtMZ43aAQ_KQLL-ZYe';
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const app = document.querySelector('#app');
    const modalRoot = document.querySelector('#modalRoot');
    const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateFmt = value => new Intl.DateTimeFormat('en-MY',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kuala_Lumpur'}).format(new Date(value));
    const toast = message => { const el=document.querySelector('#toast');el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200); };
    let adminUser=null, currentSection='home', roster=[], sessions=[], attendance=[], confirmations=[], refreshTimer=null, confirmationAttendingOnly=false;
    const modules=[
      {id:'live',icon:'◉',title:'Live Attendance',desc:'Open a QR check-in and monitor arrivals for the current activity.'},
      {id:'records',icon:'▤',title:'Attendance Records',desc:'Review check-ins across activities and find a participant or session.'},
      {id:'history',icon:'◷',title:'Attendance History',desc:'Look up a participant and see their activity-by-activity history.'},
      {id:'reports',icon:'▥',title:'Attendance Reports',desc:'Download CSV reports or print a report to save as PDF.'},
      {id:'sessions',icon:'▦',title:'Session Management',desc:'Create activity QR sessions, show codes and close check-in windows.'},
      {id:'directory',icon:'♙',title:'Participant Directory',desc:'Search participants, add or edit a record, and import roster updates.'},
      {id:'confirmations',icon:'✓',title:'Participant Confirmation',desc:'Review who can attend the programme before the camp.'},
    ];

    function checkInPage(){
      const params=new URLSearchParams(location.search),sessionId=params.get('session'),token=params.get('token');
      app.innerHTML=`<section class="check-page"><div class="card check-card"><div class="check-logo"><div class="brand-mark">LGZ</div><div class="eyebrow" style="color:#60748e">PERKESO × UUM SBM</div></div><div id="checkContent"><h1 class="check-title">Activity check-in</h1><p class="check-intro">Enter your LGZ participant ID or matric number to record attendance.</p><div class="session-chip"><small>Activity session</small><strong id="sessionTitle">Loading session…</strong></div><form id="checkForm"><div class="field"><label for="participantCode">Participant ID / Matric No.</label><input id="participantCode" required autocomplete="off" placeholder="e.g. LGZ-001 or your matric number" maxlength="40" /></div><p class="message" id="checkMessage"></p><button class="btn btn-primary" style="width:100%;padding:13px" type="submit">Confirm attendance</button></form><div class="check-foot">LINDUNG Gen-Z Leaders Camp 2026</div></div></div></section>`;
      if(!sessionId||!token){document.querySelector('#sessionTitle').textContent='Invalid QR code';document.querySelector('#checkForm').classList.add('hidden');return;}
      db.rpc('get_public_session',{p_session_id:sessionId,p_qr_token:token}).then(({data,error})=>{if(error||!data?.ok){document.querySelector('#sessionTitle').textContent='This session is closed or unavailable';document.querySelector('#checkForm').classList.add('hidden');return;}document.querySelector('#sessionTitle').textContent=data.activity_label;});
      document.querySelector('#checkForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent='Checking…';const code=document.querySelector('#participantCode').value.trim();const {data,error}=await db.rpc('lgz_check_in',{p_session_id:sessionId,p_qr_token:token,p_participant_code:code});if(error||!data?.ok){document.querySelector('#checkMessage').textContent=data?.message||'We could not record this check-in. Check your ID and try again.';btn.disabled=false;btn.textContent='Confirm attendance';return;}const isDup=data.status==='already_recorded';document.querySelector('#checkContent').innerHTML=`<div class="check-result"><div class="result-icon">✓</div><h1 class="check-title">${isDup?'Already recorded':'You’re checked in'}</h1><p class="check-intro">${isDup?'Your attendance for this activity was already recorded.':'Your attendance has been recorded successfully.'}</p><div class="session-chip"><small>Activity session</small><strong>${esc(data.activity_label)}</strong></div><div class="check-foot">You can close this page now.</div></div>`;});
    }
    function confirmationPage(){
      document.querySelector('#topStatus').textContent='Participant RSVP';
      app.innerHTML=`<section class="check-page"><div class="card check-card"><div class="check-logo"><div class="brand-mark">LGZ</div><div class="eyebrow" style="color:#60748e">PERKESO × UUM SBM</div></div><div id="confirmContent"><h1 class="check-title">Confirm your attendance</h1><p class="check-intro">Please confirm whether you can attend LINDUNG Gen-Z Leaders Camp 2026. Enter the email address and matric number you used when registering.</p><form id="confirmForm"><div class="field"><label for="confirmEmail">Email address</label><input id="confirmEmail" type="email" required autocomplete="email" maxlength="254" placeholder="The email address you registered with" /></div><div class="field"><label for="confirmMatric">Matric number</label><input id="confirmMatric" required autocomplete="off" maxlength="40" placeholder="Your matric number" /></div><div class="field"><label for="confirmResponse">Your confirmation</label><select id="confirmResponse" required><option value="">Select one response</option><option value="attending">Yes, I can attend</option><option value="cannot_attend">No, I cannot attend</option><option value="unsure">I am not sure yet</option></select></div><p class="message" id="confirmMessage" aria-live="polite"></p><button class="btn btn-primary" id="confirmSubmit" style="width:100%;padding:13px" type="submit">Submit confirmation</button></form><div class="check-foot">Your response is shared with the LGZ organising team only.</div></div></div></section>`;
      document.querySelector('#confirmForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#confirmSubmit'),message=document.querySelector('#confirmMessage');btn.disabled=true;btn.textContent='Submitting…';message.textContent='';const {data,error}=await db.rpc('lgz_submit_confirmation_email',{p_email:document.querySelector('#confirmEmail').value.trim(),p_matric_no:document.querySelector('#confirmMatric').value.trim(),p_response:document.querySelector('#confirmResponse').value});if(error||!data?.ok){message.textContent=data?.message||'We could not verify those details. Check your registered email and matric number, then try again.';btn.disabled=false;btn.textContent='Submit confirmation';return;}const labels={attending:'You confirmed that you can attend.',cannot_attend:'Your response that you cannot attend has been recorded.',unsure:'Your response has been recorded.'};document.querySelector('#confirmContent').innerHTML=`<div class="check-result"><div class="result-icon">✓</div><h1 class="check-title">Confirmation received</h1><p class="check-intro">${labels[data.response]||'Your response has been recorded.'}</p><p class="check-foot">You can submit again if your plans change.</p></div>`;});
    }
    function loginPage(message=''){
      document.querySelector('#topStatus').textContent='Admin access';
      app.innerHTML=`<section class="login-card card"><div class="eyebrow" style="color:#007dc5">LGZ TEAM ACCESS</div><h1 style="margin-top:9px">Sign in to manage attendance</h1><p class="subhead">Use the administrator account created in Supabase.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="name@example.com" /></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password" /></div><p class="message">${esc(message)}</p><button class="btn btn-primary" style="width:100%" type="submit">Sign in</button></form><p class="check-foot">Administrator accounts are managed by the LGZ system owner.</p></section>`;
      document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const {data,error}=await db.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error){loginPage('Sign-in failed. Check your email and password.');return;}adminUser=data.user;await dashboard();});
    }
    async function dashboard(){
      if(!adminUser){const {data}=await db.auth.getSession();adminUser=data.session?.user||null;}
      if(!adminUser){loginPage();return;}
      const {data:allowed,error:accessError}=await db.rpc('is_lgz_admin');
      if(accessError||!allowed){await db.auth.signOut();adminUser=null;loginPage('This account does not have LGZ administrator access.');return;}
      document.querySelector('#topStatus').textContent='Admin dashboard';
      app.innerHTML='<div class="container"><div id="workspace"></div><div class="footer">LINDUNG Gen-Z Leaders Camp 2026 · PERKESO × UUM SBM</div></div>';
      await loadDashboard();
    }
    async function loadDashboard(){
      const [p,s,a,c]=await Promise.all([
        db.from('lgz_participants').select('id,participant_code,full_name,matric_no,gender,affiliation,university,email,phone,confirmation_status,confirmation_at,created_at').order('full_name'),
        db.from('lgz_sessions').select('*').order('created_at',{ascending:false}),
        db.from('lgz_attendance_view').select('*').order('checked_in_at',{ascending:false}),
      ]);
      if(p.error||s.error||a.error){toast('Could not load records. Check the Supabase setup and access policies.');return;}
      roster=p.data||[];sessions=s.data||[];attendance=a.data||[];confirmations=roster.filter(p=>p.confirmation_status);renderWorkspace();
    }
    function sessionIsActive(row){const now=Date.now();return row.is_open&&now>=new Date(row.starts_at).getTime()&&now<=new Date(row.closes_at).getTime();}
    function countsBySession(){const counts={};attendance.forEach(x=>counts[x.session_id]=(counts[x.session_id]||0)+1);return counts;}
    function renderWorkspace(){
      const area=document.querySelector('#workspace');if(!area)return;
      if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}
      const active=sessions.find(sessionIsActive),counts=countsBySession();
      const title=currentSection==='home'?'Attendance dashboard':modules.find(x=>x.id===currentSection)?.title||'Attendance dashboard';
      area.innerHTML=`<div class="page-head"><div><div class="eyebrow" style="color:#007dc5">LGZ 2026 · PROGRAMME CONTROL</div><h1>${esc(title)}</h1><p class="subhead">Manage check-ins and attendance records for every camp activity.</p></div><div class="actions"><button class="btn btn-secondary" id="importBtn">＋ Import roster</button><button class="btn btn-primary" id="newSessionBtn">＋ New activity QR</button><button class="btn btn-secondary" id="signOutBtn">Sign out</button></div></div>${currentSection==='home'?homeView(counts,active):moduleNav()+moduleView(counts,active)}`;
      document.querySelector('#importBtn').onclick=importModal;document.querySelector('#newSessionBtn').onclick=createSessionModal;document.querySelector('#signOutBtn').onclick=async()=>{await db.auth.signOut();adminUser=null;loginPage();};
      if(currentSection==='home')bindHome();else bindModule();
    }
    function homeView(counts,active){

      modalRoot.querySelector('[data-close]').onclick=()=>modalRoot.innerHTML='';modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)modalRoot.innerHTML='';};
      QRCode.toCanvas(link.href,{width:220,margin:2,errorCorrectionLevel:'H',color:{dark:'#071b3c',light:'#ffffff'}},(err,canvas)=>{if(!err&&document.querySelector('#qr'))document.querySelector('#qr').append(canvas);});
      modalRoot.querySelector('#downloadQr').onclick=()=>{const c=modalRoot.querySelector('#qr canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`LGZ-${session.activity_label.replace(/[^a-z0-9]+/gi,'-').slice(0,35)}-QR.png`;a.click();};
      modalRoot.querySelector('#copyLink').onclick=async()=>{await navigator.clipboard.writeText(link.href);toast('Check-in link copied.');};
    }
    async function closeSession(id){if(!confirm('Close this activity check-in now? The QR will stop accepting attendance.'))return;const {error}=await db.from('lgz_sessions').update({is_open:false}).eq('id',id);if(error)toast('Could not close this session.');else{toast('Check-in closed.');await loadDashboard();}}
    async function attendanceModal(sessionId,title){const rows=attendance.filter(x=>x.session_id===sessionId);modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal card" style="width:min(720px,100%)"><div class="modal-head"><div><h2>${esc(title)}</h2><div class="section-kicker">${rows.length} participant check-ins</div></div><button class="close" data-close>×</button></div><div class="table-wrap"><table><thead><tr><th>Participant ID</th><th>Name</th><th>Affiliation</th><th>Checked in</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${esc(x.participant_code)}</td><td>${esc(x.full_name)}</td><td>${esc(x.affiliation)}</td><td>${dateFmt(x.checked_in_at)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No check-ins recorded for this activity.</td></tr>'}</tbody></table></div></div></div>`;modalRoot.querySelector('[data-close]').onclick=()=>modalRoot.innerHTML='';modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)modalRoot.innerHTML='';};}
    function importModal(){
      modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal card"><div class="modal-head"><h2>Import participant roster</h2><button class="close" data-close>×</button></div><p class="subhead">Upload the participant columns: <b>Nama penuh, No. matrik, Jantina, E-mel, No. telefon, Universiti</b>. Participant ID is optional; existing people are matched by matric number.</p><div class="field"><label>Participant CSV file</label><input type="file" id="rosterFile" accept=".csv,text/csv" /></div><p class="message" id="modalMessage"></p><button class="btn btn-primary" id="uploadRoster" style="width:100%">Import roster</button><button class="btn btn-secondary" id="templateCsv" style="width:100%;margin-top:9px">Download CSV template</button></div></div>`;
      modalRoot.querySelector('[data-close]').onclick=()=>modalRoot.innerHTML='';modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)modalRoot.innerHTML='';};
      modalRoot.querySelector('#templateCsv').onclick=()=>download('lgz-roster-template.csv','Nama penuh,No. matrik,Jantina,E-mel,No. telefon,Universiti\nContoh Peserta,000000,Lelaki,,,UUM\n');
      modalRoot.querySelector('#uploadRoster').onclick=async()=>{const file=modalRoot.querySelector('#rosterFile').files[0];if(!file){modalRoot.querySelector('#modalMessage').textContent='Choose a CSV file first.';return;}try{const rows=parseCsv(await file.text()),normalise=h=>h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''),headers=rows.shift().map(normalise),col=(...aliases)=>headers.findIndex(h=>aliases.includes(h)),ci=col('participantcode','participantid','kodpeserta'),ni=col('fullname','namapenuh','nama'),mi=col('matricno','nomatrik','nombormatrik','matrik'),gi=col('gender','jantina'),ei=col('email','emel'),pi=col('phone','phoneno','notelefon','nombortelefon','telephone'),ui=col('university','universiti','affiliation','institution');if(ni<0||mi<0)throw Error('The CSV must contain a full name and matric number column.');const existingByCode=new Map(roster.map(p=>[String(p.participant_code||'').toLowerCase(),p])),existingByMatric=new Map(roster.filter(p=>p.matric_no).map(p=>[String(p.matric_no).toLowerCase(),p]));const batch=rows.filter(r=>r[ni]?.trim()&&r[mi]?.trim()).map(r=>{const matric=r[mi].trim(),matched=existingByMatric.get(matric.toLowerCase()),typedCode=ci>=0?(r[ci]||'').trim():'',code=typedCode||matched?.participant_code||matric,existing=existingByCode.get(code.toLowerCase())||matched,university=ui>=0?(r[ui]||'').trim():(existing?.university||existing?.affiliation||''),email=ei>=0?(r[ei]||'').trim():(existing?.email||''),phone=pi>=0?(r[pi]||'').trim():(existing?.phone||'');return{participant_code:code,full_name:r[ni].trim(),matric_no:matric,gender:gi>=0?(r[gi]||'').trim():(existing?.gender||''),affiliation:university,university,email:email||existing?.email||null,phone:phone||existing?.phone||null};});if(!batch.length)throw Error('No participant rows with both name and matric number were found.');for(let i=0;i<batch.length;i+=300){const {error}=await db.from('lgz_participants').upsert(batch.slice(i,i+300),{onConflict:'participant_code'});if(error)throw Error('Import failed. Check duplicate participant IDs or matric numbers and confirm the database update has been applied.');}modalRoot.innerHTML='';toast(`${batch.length} participant records imported.`);await loadDashboard();}catch(err){modalRoot.querySelector('#modalMessage').textContent=err.message;}};
    }
    function exportRows(rows){const records=[['participant_code','matric_no','full_name','gender','university','activity','checked_in_at'],...rows.map(x=>[x.participant_code,x.matric_no,x.full_name,x.gender,x.university||x.affiliation,x.activity_label,x.checked_in_at])];download('lgz-2026-attendance.csv',records.map(row=>row.map(csvCell).join(',')).join('\r\n'));toast(`${rows.length} attendance records exported.`);}
    function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(ch==='"')quoted=false;else cell+=ch;}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell='';}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=ch;}if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);}return rows.filter(r=>r.some(v=>v.trim()));}
    const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    function download(name,text){const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);}
    const routeParams=new URLSearchParams(location.search);if(routeParams.has('session'))checkInPage();else if(routeParams.has('confirm'))confirmationPage();else dashboard();
  </script>
